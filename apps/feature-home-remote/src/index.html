<!doctype html>
<html lang="en">
  <head>
    <script>
      // CRITICAL: Initialize chunk registry BEFORE any scripts load
      // This prevents "Cannot set properties of undefined" errors during HMR
      // Must match chunkLoadingGlobal in rspack.config.js
      (function () {
        // Initialize the specific chunk loading global used by this remote
        const chunkGlobal = 'webpackChunkfeature_home_remote';
        if (!window[chunkGlobal]) {
          window[chunkGlobal] = [];
        }
        // Also initialize default as fallback
        if (!window.webpackChunk) {
          window.webpackChunk = [];
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feature Home Remote</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
